[workspace]
resolver = "2"
members = [
    "merkle-core",
    "merkle-hash",
    "merkle-variants",
    "merkle-bench",
]

[workspace.package]
version = "0.4.0"
edition     = "2024"
rust-version = "1.97.1"
authors     = ["Blessing Samuel <dicethedev>"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/dicethedev/MerkleForge"
keywords    = ["merkletree", "blockchain", "cryptography", "hashing", "hash functions"]
categories  = ["cryptography", "data-structures"]

# Shared dependency versions — bump once, applies everywhere
[workspace.dependencies]
# Hashing
sha2        = { version = "0.11.0", default-features = false }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
blake3      = { version = "1.8.5", default-features = false }

# Serialisation
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bincode    = { version = "2.0.1", features = ["serde"] }

# Testing / benchmarking
criterion  = { version = "0.8.2", features = ["html_reports"] }
proptest   = "1.11.0"

# Shared internal crates
merkle-core = { path = "merkle-core", version = ">=0.2.1, <0.5.0" }
merkleforge-hash = { path = "merkle-hash", version = ">=0.2.1, <0.5.0" }
