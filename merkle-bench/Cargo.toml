[package]
name        = "merkle-bench"
description = "Isolated Criterion benchmarking suite for the MerkleForge workspace"
publish     = false   # never publish this internal crate to crates.io
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
authors.workspace    = true
license.workspace    = true

[dev-dependencies]
merkle-core = { workspace = true }
merkleforge-hash = { workspace = true }
merkle-variants = { path = "../merkle-variants" }
criterion   = { workspace = true }
rs_merkle   = "1.5.0"
merkle_light = "0.4.0"
sha2        = { workspace = true }

[[bench]]
name    = "baseline_construction"
harness = false

[[bench]]
name    = "hash_throughput"
harness = false

[[bench]]
name    = "binary_tree"
harness = false

[[bench]]
name    = "sparse_tree"
harness = false

[[bench]]
name    = "patricia_trie"
harness = false

[[bench]]
name    = "bench_energy"
harness = false

[[bench]]
name    = "comparison"
harness = false
