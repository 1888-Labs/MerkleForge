# .github/workflows/ci.yml
#
# Automated pipeline for the MerkleForge workspace.
# Mirrors the "Reliability & CI/CD (The Pipeline)" section of the
# architecture slide:
#   GitHub Actions → Build & Validate → ProofVerifier module → End Users
#
# Jobs:
#   1. test     — unit tests, property-based tests, doc tests
#   2. lint     — clippy (pedantic) + rustfmt check
#   3. bench-dry — ensures benchmarks compile (no regression)
#   4. docs     — rustdoc build check
#   5. bench-publish — publishes Criterion HTML reports from main

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"   # treat all warnings as errors
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"   # avoid git2/rustls issues on Windows
  CARGO_NET_RETRY: 10   # retry git fetches to mitigate transient network issues

jobs:
  # ── 1. Test ───────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]   # catch breakage early on beta channel
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (all workspace members)
        run: cargo build --workspace --all-features

      - name: Unit tests + doc tests
        run: cargo test --workspace --all-features -- --include-ignored

  # ── 2. Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 3. Bench dry-run ─────────────────────────────────────────────────────
  bench-dry:
    name: Benchmarks compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile benchmarks (no run)
        run: cargo bench --workspace --no-run

  # ── 4. Docs ───────────────────────────────────────────────────────────────
  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build docs (deny broken intra-doc links)
        run: >
          RUSTDOCFLAGS="-D warnings"
          cargo doc --workspace --all-features --no-deps

  # ── 5. Benchmark report publishing ──────────────────────────────────────
  bench-publish:
    name: Publish benchmark reports
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Run all Criterion benchmarks
        run: cargo bench --workspace

      - name: Stage Criterion reports
        run: |
          set -euo pipefail
          mkdir -p benchmark-pages/criterion
          cp -R target/criterion/. benchmark-pages/criterion/

          python3 - <<'PY'
          from pathlib import Path

          index = Path("benchmark-pages/index.html")
          index.write_text("""<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=criterion/report/index.html">
              <title>MerkleForge Benchmarks</title>
            </head>
            <body>
              <p>Redirecting to the latest MerkleForge Criterion report...</p>
              <p><a href="criterion/report/index.html">Open benchmark report</a></p>
            </body>
          </html>
          """)
          PY

      - name: Publish reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: benchmark-pages
