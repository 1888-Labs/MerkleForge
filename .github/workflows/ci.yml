# .github/workflows/ci.yml
#
# Automated pipeline for the MerkleForge workspace.
# Mirrors the "Reliability & CI/CD (The Pipeline)" section of the
# architecture slide:
#   GitHub Actions → Build & Validate → ProofVerifier module → End Users
#
# Jobs:
#   1. test     — unit tests, property-based tests, doc tests
#   2. lint     — clippy (pedantic) + rustfmt check
#   3. no-std  — verifies merkle-core on a bare-metal target
#   4. bench-dry — ensures benchmarks compile (no regression)
#   5. docs     — rustdoc build check
#   6. site     — builds the Vocs website in docs/
#   7. scripts  — unit tests for the Python scripts in .github/scripts
#
# All Rust jobs use the toolchain pinned in rust-toolchain.toml.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"   # treat all warnings as errors
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"   # avoid git2/rustls issues on Windows
  CARGO_NET_RETRY: 10   # retry git fetches to mitigate transient network issues

jobs:
  # ── 1. Test ───────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Build (all workspace members)
        run: cargo build --workspace --all-features

      - name: Unit tests + doc tests
        run: cargo test --workspace --all-features -- --include-ignored

  # ── 2. Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 3. no_std compile check ──────────────────────────────────────────────
  no-std:
    name: Check no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: thumbv7em-none-eabihf

      - name: Check merkle-core without std
        run: >
          cargo check -p merkle-core
          --no-default-features
          --features alloc
          --target thumbv7em-none-eabihf

  # ── 4. Bench dry-run ─────────────────────────────────────────────────────
  bench-dry:
    name: Benchmarks compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Compile benchmarks (no run)
        run: cargo bench --workspace --no-run

  # ── 5. Docs ───────────────────────────────────────────────────────────────
  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Build docs (deny broken intra-doc links)
        run: >
          RUSTDOCFLAGS="-D warnings"
          cargo doc --workspace --all-features --no-deps

  # ── 6. Website build ────────────────────────────────────────────────────
  site:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: docs

      - name: Build Vocs site
        run: npm run build
        working-directory: docs

  # ── 7. Script tests ─────────────────────────────────────────────────────
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v
