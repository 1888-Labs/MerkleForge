name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, for example 0.4.1"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  release:
    name: Release workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Validate version input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", version):
              raise SystemExit(f"invalid semantic version: {version}")
          PY

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Prepare release files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/prepare_release.py "$RELEASE_VERSION" --release-body /tmp/release_body.md

      - name: Show release diff
        run: |
          git diff -- Cargo.toml CHANGELOG.md
          cat /tmp/release_body.md

      - name: Commit release bump
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml CHANGELOG.md
          git commit -m "chore(release): bump workspace to v${RELEASE_VERSION}"

      - name: Create release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: git tag "v${RELEASE_VERSION}"

      - name: Push release commit and tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${RELEASE_VERSION}"

      - name: Publish crates.io packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          publish_if_missing() {
            local package="$1"
            local crate="$2"

            if curl --silent --fail "https://crates.io/api/v1/crates/${crate}/${RELEASE_VERSION}" >/dev/null; then
              echo "${crate} v${RELEASE_VERSION} is already published; skipping."
              return
            fi

            echo "Publishing ${package} as ${crate} v${RELEASE_VERSION}..."
            cargo publish -p "${package}" --token "${CARGO_REGISTRY_TOKEN}"
            sleep 20
          }

          publish_if_missing "merkle-core" "merkle-core"
          publish_if_missing "merkleforge-hash" "merkleforge-hash"
          publish_if_missing "merkle-variants" "merkle-variants"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "v${RELEASE_VERSION}" --title "v${RELEASE_VERSION}" --notes-file /tmp/release_body.md

      - name: Build Telegram release notification
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "MerkleForge v${RELEASE_VERSION} released"
            echo
            echo "Crates published: merkle-core, merkleforge-hash, merkle-variants"
            echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION}"
          } > telegram_release.txt

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/publish_telegram.py telegram_release.txt
